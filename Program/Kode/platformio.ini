[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM3
monitor_port = COM3
monitor_speed = 115200

; Optimasi compiler untuk memori & kecepatan inferensi TinyML
build_flags = 
    -O3
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mathworks/ThingSpeak @ ^2.0.0
